[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcontracts-cli"
version = "0.1.1"
description = "Search US federal contracts from your terminal — powered by USASpending.gov data, updated nightly"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "federal-contracts",
    "government",
    "usaspending",
    "procurement",
    "govtech",
    "cli",
    "open-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://govspendapi.com"
Repository = "https://github.com/d0nldduck22-crypto/fedcontracts-cli"
Issues = "https://github.com/d0nldduck22-crypto/fedcontracts-cli/issues"
"RapidAPI Listing" = "https://rapidapi.com/d0nldduck22-crypto/api/govspend-us-federal-contracts"

[project.scripts]
fedcontracts = "fedcontracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fedcontracts"]
