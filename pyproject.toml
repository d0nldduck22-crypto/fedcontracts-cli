[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedcontracts-cli"
version = "0.1.0"
description = "Search US federal contracts from your terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.scripts]
fedcontracts = "fedcontracts.cli:main"
